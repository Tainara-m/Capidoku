*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-family:'Fredoka','Nunito','Segoe UI',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;align-items:center;padding:10px 12px;gap:8px}
header{text-align:center;flex:none}
h1{margin:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(24px,5.5vmin,40px);font-weight:700}
.ico{display:inline-block;background:var(--icon) center/contain no-repeat;width:1.25em;height:1.05em;flex:none}
.sub{margin:2px 0 0;font-size:clamp(11px,2.2vmin,15px);color:var(--soft);max-width:34em}
.bar{flex:none;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.seg{display:flex;background:var(--card);border-radius:99px;padding:3px}
.seg button{border:0;background:none;font:inherit;font-weight:600;color:var(--soft);padding:5px 13px;border-radius:99px;cursor:pointer;font-size:clamp(13px,2.4vmin,16px)}
.seg button:disabled{opacity:.35}
.seg button.on{background:var(--accent);color:#fff}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:5px 13px;font-weight:600;font-size:clamp(13px,2.4vmin,16px);font-variant-numeric:tabular-nums}
.pill .ico{width:1.3em;height:1.1em}
main{flex:1;min-height:0;width:100%;container-type:size;display:grid;place-items:center}
#board{width:min(100cqw,100cqh);height:min(100cqw,100cqh);display:grid;gap:3px;padding:6px;border-radius:22px;background:var(--card);box-shadow:0 10px 30px rgba(107,68,38,.15);touch-action:none}
.c{position:relative;display:grid;place-items:center;border-radius:clamp(6px,1.6vmin,12px);cursor:pointer;min-width:0;min-height:0;color:var(--tile-ink);transition:filter .15s}
.c.x::after{content:"✕";font-size:clamp(12px,3.6vmin,28px);font-weight:700;opacity:.4}
.c.blk{filter:saturate(.35) brightness(1.08)}
.c.blk::after{content:"✕";font-size:clamp(10px,2.8vmin,22px);font-weight:700;opacity:.45}
.c.cap{box-shadow:0 0 0 3px rgba(255,255,255,.7) inset}
.snd{padding:3px 12px 3px 8px}
.snd button{border:0;background:none;font-size:1.15em;padding:2px 4px;cursor:pointer;line-height:1}
.snd button.off{opacity:.35}
#vol{width:64px;height:22px;accent-color:var(--accent);margin:0;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);transform:translate(-50%,10px);background:var(--ink);color:var(--card);padding:9px 16px;border-radius:16px;font-size:14px;max-width:min(90vw,340px);text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:4}
#toast.show{opacity:1;transform:translate(-50%,0)}
.c.cap::before{content:"";position:absolute;inset:6%;background:var(--capy) center/contain no-repeat;animation:pop .28s cubic-bezier(.3,1.8,.5,1)}
.c.bad{box-shadow:inset 0 0 0 3px var(--bad);animation:shake .35s}
footer{flex:none;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.btn{border:0;font:inherit;font-weight:600;color:#fff;background:var(--accent);padding:9px 15px;border-radius:99px;cursor:pointer;box-shadow:0 3px 0 var(--accent-d);font-size:clamp(14px,2.6vmin,17px)}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 3px 0 rgba(107,68,38,.22)}
.btn.alt.on{background:#ffe2b8;color:#6b4426}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45}
#win{position:fixed;inset:0;display:none;place-items:center;background:rgba(60,35,20,.45);z-index:5;padding:20px}
#win.show{display:grid}
#win .box{background:var(--card);border-radius:28px;padding:22px 26px;text-align:center;max-width:320px;animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
#winCapy{width:110px;height:120px;margin:0 auto;background:var(--capy) center/contain no-repeat}
#win h2{margin:6px 0 4px;font-size:24px}
#win p{margin:0 0 14px;color:var(--soft)}
.fall{position:fixed;top:-40px;width:34px;height:30px;font-size:26px;pointer-events:none;z-index:6;animation:fall linear forwards}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

<script>

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function genSol(n){
  const p=[],used=new Set();
  (function go(r){
    if(r===n)return true;
    for(const x of shuffle([...Array(n).keys()])){
      if(used.has(x)||(r&&Math.abs(p[r-1]-x)<2))continue;
      p[r]=x;used.add(x);
      if(go(r+1))return true;
      used.delete(x);
    }
    return false;
  })(0);
  return p;
}
function genReg(s,n){
  const g=Array(n*n).fill(-1);
  s.forEach((c,r)=>g[r*n+c]=r);
  let left=n*n-n;
  while(left>0){
    const opts=[];
    for(let i=0;i<n*n;i++){
      if(g[i]>=0)continue;
      const r=Math.floor(i/n),c=i%n;
      [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([a,b])=>{if(a>=0&&b>=0&&a<n&&b<n&&g[a*n+b]>=0)opts.push([i,g[a*n+b]])});
    }
    const [i,k]=opts[Math.floor(Math.random()*opts.length)];
    g[i]=k;left--;
  }
  return g;
}
function count(g,n){
  let c=0;const cols=new Set(),rg=new Set();
  (function go(r,pc){
    if(c>1)return;

    for(let x=0;x<n;x++){
      if(cols.has(x)||Math.abs(x-pc)<2)continue;
      const k=g[r*n+x];if(rg.has(k))continue;
      cols.add(x);rg.add(k);go(r+1,x);cols.delete(x);rg.delete(k);
    }
  })(0,-9);
  return c;
}

  cat:()=>{tone(660,.1,'triangle',.3);tone(990,.15,'triangle',.25,.07)},
  remove:()=>tone(440,.12,'triangle',.22,0,260),
  wrong:()=>{tone(200,.18,'sawtooth',.16,0,120);tone(150,.24,'sawtooth',.14,.13,90)},
  hint:()=>[784,988,1175,1568].forEach((f,i)=>tone(f,.15,'sine',.2,i*.07)),
  win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.24,'triangle',.28,i*.12)),
  lose:()=>[392,349,294,196].forEach((f,i)=>tone(f,.3,'triangle',.25,i*.18)),
  click:()=>tone(600,.05,'square',.07)
};
const sfx=n=>{try{SFX[n]()}catch(e){}};
/* Trilha 8-bit original: melodia (quadrada), baixo (triângulo), bumbo e chimbal; loop de 8 compassos em Dó maior */
const MEL=[[76,0,79,76,72,0,74,76],[81,0,79,76,0,72,76,0],[77,0,81,0,77,72,0,69],[79,0,74,79,83,0,79,74],[72,76,79,0,84,0,79,0],[81,0,79,76,72,0,76,0],[77,81,84,81,77,0,72,0],[79,0,83,79,74,0,79,0]];
const ROOT=[48,45,41,43];
const mf=m=>440*Math.pow(2,(m-69)/12);
function voice(f,t,d,type,g,slide){
  const o=ac.createOscillator(),e=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(g,t+.01);e.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(e);e.connect(musicG);o.start(t);o.stop(t+d+.03);
}
function hat(t){
  if(!noiseBuf){noiseBuf=ac.createBuffer(1,(ac.sampleRate*.1)|0,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),e=ac.createGain();
  s.buffer=noiseBuf;f.type='highpass';f.frequency.value=7000;
  e.gain.setValueAtTime(.06,t);e.gain.exponentialRampToValueAtTime(.001,t+.05);
  s.connect(f);f.connect(e);e.connect(musicG);s.start(t);s.stop(t+.06);
}
function note(step,t){
  const bar=step>>3,s=step&7,m=MEL[bar][s],r=ROOT[bar&3];
  if(m)voice(mf(m),t,SP*1.6,'square',.07);
  if(!(s&1))voice(mf(s&2?r+7:r),t,SP*1.7,'triangle',.16);
  if(s===0||s===4)voice(130,t,.12,'sine',.22,45);
  if(s===2||s===6)hat(t);
}
function sched(){while(ac&&mNext<ac.currentTime+.3){note(mStep,mNext);mNext+=SP;mStep=(mStep+1)%64}}
function musicStart(){
  if(mTimer||!mOn||document.hidden)return;
  const a=ctx();if(!a)return;
  if(!musicG){musicG=a.createGain();musicG.gain.value=.55;musicG.connect(master)}
  mNext=a.currentTime+.1;mTimer=setInterval(sched,80);
}
function musicStop(){clearInterval(mTimer);mTimer=0}
document.addEventListener('visibilitychange',()=>{if(document.hidden)musicStop();else if(!muted)musicStart()});
function saveSnd(){try{localStorage.setItem('capidoku-snd',JSON.stringify({vol,muted,music:mOn}))}catch(e){}}
function sndUI(){
  $('#mute').textContent=muted||!vol?'🔇':vol<.4?'🔈':'🔊';
  $('#vol').value=Math.round(vol*100);
  $('#mus').classList.toggle('off',!mOn);
}
addEventListener('pointerdown',()=>{if(!muted){ctx();musicStart()}});
document.addEventListener('click',e=>{if(e.target.closest('button')&&!e.target.closest('#mute'))sfx('click')});
$('#mus').onclick=()=>{mOn=!mOn;if(mOn&&!muted)musicStart();else musicStop();sndUI();saveSnd()};
$('#mute').onclick=()=>{muted=!muted;if(!muted&&!vol)vol=.5;setVol();if(!muted)musicStart();sndUI();saveSnd();sfx('cat')};
$('#vol').oninput=e=>{vol=e.target.value/100;if(vol>0)muted=false;setVol();if(!muted)musicStart();sndUI();saveSnd()};
$('#vol').onchange=()=>sfx('cat');
const clash=(i,j)=>{
  const ri=Math.floor(i/N),rj=Math.floor(j/N),ci=i%N,cj=j%N;
  return ri===rj||ci===cj||reg[i]===reg[j]||(Math.abs(ri-rj)<2&&Math.abs(ci-cj)<2);
};
function start(fresh){
  $('#win').classList.remove('show');
  if(fresh){
    N=sizeOf(lvl);const t=Date.now();
    do{sol=genSol(N);reg=genReg(sol,N)}while(count(reg,N)!==1&&Date.now()-t<3000);
  }
  st=Array(N*N).fill(0);hist=[];done=false;lives=3;hints=lvl;last=null;
  B.style.gridTemplate=`repeat(${N},1fr)/repeat(${N},1fr)`;
  B.innerHTML='';
  for(let i=0;i<N*N;i++){
    const d=document.createElement('div');
    d.className='c';d.dataset.i=i;d.style.background=PAL[reg[i]%PAL.length];
    B.appendChild(d);
  }
  update();
}
function update(){
  const caps=[];st.forEach((v,i)=>{if(v===2)caps.push(i)});
  [...B.children].forEach((d,i)=>{
    d.classList.toggle('cap',st[i]===2);
    d.classList.toggle('x',st[i]===1);
    d.classList.toggle('blk',guide&&st[i]===0&&caps.some(c=>clash(c,i)));
  });
  $('#cnt').textContent=`${caps.length}/${N}`;
  $('#hearts').textContent='❤️'.repeat(lives)+'🤍'.repeat(3-lives);
  $('#undo').disabled=!hist.length;
  $('#hint').textContent='Dica 💡 '+hints;$('#hint').disabled=!hints;
  $('#lvl').textContent='Nível '+lvl;
  $('#prev').disabled=lvl<=1;$('#nextlv').disabled=lvl>=maxLvl;
  if(!done&&caps.length===N)finish(true);
}
function place(i){
  if(sol[Math.floor(i/N)]===i%N){st[i]=2;sfx('cat');return}
  st[i]=1;lives--;sfx('wrong');
  const d=B.children[i];d.classList.add('bad');setTimeout(()=>d.classList.remove('bad'),600);
  if(lives<=0){done=true;setTimeout(()=>finish(false),600)}
}
function finish(ok){
  done=true;won=ok;
  if(ok){
    if(lvl>=maxLvl){maxLvl=lvl+1;try{localStorage.setItem('capidoku-max',maxLvl)}catch(e){}}
    for(let i=0;i<22;i++){
      const f=document.createElement('div');
      f.className='fall'+(i%3?'':' ico');
      if(i%3)f.textContent=['🌸','🍃','✨'][i%3];
      f.style.left=Math.random()*100+'vw';
      f.style.animationDuration=(2+Math.random()*2.5)+'s';
      f.style.animationDelay=Math.random()*.8+'s';
      document.body.appendChild(f);setTimeout(()=>f.remove(),5500);
    }
  }
  sfx(ok?'win':'lose');$('#winH').textContent=ok?'Capivara-mente perfeito!':'Ai, acabaram as vidas 💔';
  $('#winTxt').textContent=ok?`Nível ${lvl} completo!${lives===3?' Sem errar nenhuma vez 🌟':''}`:'Respire fundo e tente de novo, você consegue.';
  $('#next').textContent=ok?'Próximo nível':'Tentar de novo';
  $('#win').classList.add('show');
  update();
}
/* 2 toques = capivara · 1 toque = ✕ (ou tira a capivara) · arrastar = marca vários ✕ */
const cellAt=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.closest?e.closest('.c'):null};
function paint(i){
  const b=st[i];
  if(drag.mode===1&&st[i]===0)st[i]=1;
  else if(drag.mode===0&&st[i]===1)st[i]=0;
  if(st[i]!==b){const n=performance.now();if(n-lastTick>50){lastTick=n;sfx(st[i]?'mark':'unmark')}}
}
B.addEventListener('pointerdown',e=>{
  if(done)return;
  const c=e.target.closest('.c');if(!c)return;
  const i=+c.dataset.i;
  drag={start:i,last:i,moved:false,snap:st.slice(),mode:st[i]===0?1:st[i]===1?0:null};
});
B.addEventListener('pointermove',e=>{
  if(!drag)return;
  const c=cellAt(e.clientX,e.clientY);if(!c)return;
  const i=+c.dataset.i;if(i===drag.last)return;
  drag.last=i;
  if(!drag.moved){drag.moved=true;if(drag.mode!==null)paint(drag.start)}
  if(drag.mode!==null){paint(i);update()}
});
function endDrag(){
  if(!drag)return;
  const d=drag;drag=null;
  if(done)return;
  if(!d.moved){
    const i=d.start,now=Date.now();
    if(last&&last.i===i&&now-last.t<320){
      hist.pop();d.snap=last.snap;st=last.snap.slice();last=null;place(i);
    }else{
      sfx(st[i]===2?'remove':st[i]===0?'mark':'unmark');
      st[i]=st[i]===0?1:0;
      last={i,t:now,snap:d.snap};
    }
  }
  if(st.join()!==d.snap.join()){hist.push(d.snap);if(hist.length>150)hist.shift()}
  update();
}
addEventListener('pointerup',endDrag);
addEventListener('pointercancel',endDrag);
$('#undo').onclick=()=>{if(done||!hist.length)return;st=hist.pop();last=null;update()};
$('#guide').onclick=e=>{guide=!guide;e.currentTarget.classList.toggle('on',guide);update();toast(guide?'Guia ligado! Ao colocar uma capivara, as casas bloqueadas por ela ficam apagadas com ✕.':'Guia desligado.')};
$('#hint').onclick=()=>{
  if(done||!hints)return;hints--;
  hist.push(st.slice());
  const miss=sol.map((c,r)=>r*N+c).filter(i=>st[i]!==2);
  if(miss.length){st[miss[Math.floor(Math.random()*miss.length)]]=2;sfx('hint')}
  update();
};
$('#new').onclick=()=>start(false);
$('#next').onclick=()=>{if(won){lvl++;start(true)}else start(false)};
$('#prev').onclick=()=>{if(lvl>1){lvl--;start(true)}};
$('#nextlv').onclick=()=>{if(lvl<maxLvl){lvl++;start(true)}};
sndUI();
start(true);
</script>
</body>
</html>
